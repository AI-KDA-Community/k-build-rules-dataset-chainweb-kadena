[package]
name = "pact5-build-rules-build"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "pact5-build-rules-build"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
regex = "1"
rmp-serde = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rocksdb = { version = "0.24", features = ["zstd"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
